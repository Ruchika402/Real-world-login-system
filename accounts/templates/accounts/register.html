<!DOCTYPE html>
<html>
<head>
    <title>Register - My App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .errorlist { color: red; font-size: 0.9em; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
       <!-- Change URL tags to remove 'accounts:' -->
<p style="margin-top: 20px;">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
</body>
</html>
